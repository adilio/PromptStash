[build]
  command = "npm run build"
  publish = "dist"

# Firebase Authentication's OAuth helpers must be served on the same branded
# domain configured in src/firebase/client.ts, so Google's consent screen says
# "Continue to promptstash.4dl.ca" instead of naming the Firebase project. This
# is a transparent proxy (200 rewrite), not a browser redirect. Must come before
# the SPA catch-all, or index.html would swallow it.
#
# The target host is <project-id>.firebaseapp.com. The bare `promptstash` was
# already taken — project ids are globally unique — so the project is
# promptstash-4dl, matching the forkast-4dl convention. The branded host in
# src/firebase/client.ts is the site domain and is unrelated to the project id.
[[redirects]]
  from = "/__/auth/*"
  to = "https://promptstash-4dl.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA: serve index.html for client-routed paths like /p/<public-slug>.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
